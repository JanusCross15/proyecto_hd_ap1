name: CD Pipeline - Vercel y Render

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    name: Verificación previa al despliegue
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar archivos base del proyecto
        run: |
          for file in index.html tienda.html carrito.html contacto.html login.html acercade.html styles.css script.js README.md; do
            if [ ! -f "$file" ]; then
              echo "Error: falta el archivo $file"
              exit 1
            fi
          done

      - name: Validar sintaxis JavaScript
        run: node --check script.js

      - name: Auditar vistas HTML5
        run: npx --yes htmlhint "*.html"

  deploy-vercel:
    name: Despliegue en Vercel (y hook opcional Render)
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Obtener configuración del proyecto en Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Construir artefacto para producción
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Desplegar frontend en producción (Vercel)
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "URL desplegada en Vercel: $DEPLOY_URL"

      - name: Disparar despliegue de backend en Render (opcional)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Webhook de Render disparado correctamente."
          else
            echo "Sin backend en Render configurado. Omitiendo despliegue de API."
          fi
