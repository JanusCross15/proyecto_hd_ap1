<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Moda y Estilo Única</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<!-- NAVBAR -->
<header>
    <h2 class="logo">MODA Y ESTILO UNICA</h2>
    <nav>
        <a href="index.html">Inicio</a>
        <a href="tienda.html">Tienda</a>
        <a href="acercade.html">Acerca de</a>
        <a href="contacto.html">Contacto</a>
        <a href="carrito.html">Carrito (<span id="contador">0</span>)</a>
        <a href="login.html">Iniciar sesion</a>
    </nav>
</header>


<!-- Imagen Banner -->
<section class="imagenBannerLogin">
    <h1>Crea tu cuenta y vive la experiencia única</h1>
</section>

<!-- CONTENIDO PRINCIPAL -->
<main class="container py-5">

    <!-- FORMULARIO -->
    <section id="registro" class="row justify-content-center mb-5">
        <div class="col-lg-5 col-md-8">
            <h2 class="text-center mb-4">Crear cuenta</h2>

            <form id="formRegistro">
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <!-- id="nombre"-->
                    <input type="text" id="nombre" placeholder="Ingresa tu nombre" required>
                </div>
                <div class="mb-3">
                    <label for="correo" class="form-label">Correo</label>
                    <!-- id="correo"-->
                    <input type="email" id="correo" placeholder="ejemplo@correo.com" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <!-- id="password"-->
                    <input type="password" id="password"
                           placeholder="Mínimo 8 caracteres, una mayúscula y un número" required>
                </div>
                <button type="submit" class="w-100 mt-2">Registrarse</button>
            </form>
        </div>
    </section>

    <!-- TABLA DE USUARIAS -->
    <section id="usuarios">
        <h2 style="text-align:left; margin-bottom:20px; color:#D08C72;">
            Usuarias registradas
        </h2>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead style="background:#d08c72; color:white;">
                    <tr>
                        <th>N°</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                    </tr>
                </thead>
                <!-- id="listaUsuarios" -->
                <tbody id="listaUsuarios">
                    <tr>
                        <td colspan="3" class="text-center" style="color:#555; padding:20px;">
                            Aún no hay usuarias registradas
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>

</body>
</html>
